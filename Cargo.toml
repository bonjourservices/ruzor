[package]
name = "pyzor"
version = "0.1.0"
edition = "2024"
authors = ["Bonjour Services"]
rust-version = "1.95"
description = "1:1-compatible Rust implementation of the Pyzor UDP client and server"
readme = "README.md"
documentation = "https://docs.rs/pyzor"
homepage = "https://github.com/bonjourservices/pyzor"
repository = "https://github.com/bonjourservices/pyzor"

license = "MIT"
keywords = ["pyzor", "spam", "email", "udp", "cli"]
categories = ["command-line-utilities", "email", "network-programming"]
include = [
    "build.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "src/**",
    "tests/**",
    "!tests/reference_parity/**",
]

[dependencies]
encoding_rs = "0.8.35"
gdbm-sys = { version = "0.3.0", optional = true }
libc = { version = "0.2", optional = true }
mysql = { version = "28.0.0", default-features = false, features = ["minimal"], optional = true }

[lib]
name = "pyzor"
path = "src/lib.rs"

[[bin]]
name = "pyzor"
path = "src/bin/pyzor.rs"

[[bin]]
name = "pyzord"
path = "src/bin/pyzord.rs"

[features]
default = ["backend-gdbm", "backend-redis", "backend-mysql"]
backend-gdbm = ["dep:gdbm-sys", "dep:libc"]
backend-gdbm-native = ["backend-gdbm"]
backend-redis = []
backend-mysql = ["dep:mysql"]

[package.metadata.docs.rs]
no-default-features = true
features = ["backend-redis", "backend-mysql"]
