[package]
name = "ruzor"
version = "0.1.0"
edition = "2024"
authors = ["Bonjour Services"]
rust-version = "1.95"
description = "Ruzor, a 1:1-compatible Rust port of the Pyzor UDP client and server"
readme = "README.md"
documentation = "https://docs.rs/ruzor"
homepage = "https://ruzor.org"
repository = "https://github.com/bonjourservices/ruzor"

license = "GPL-3.0-only"
keywords = ["ruzor", "pyzor", "spam", "email", "udp"]
categories = ["command-line-utilities", "email", "network-programming"]
include = [
    "build.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "benchmarks/**",
    "documentation/**",
    "site/**",
    "src/**",
    "tests/**",
    "!tests/reference_parity/**",
]

[dependencies]
encoding_rs = "0.8.35"
gdbm-sys = { version = "0.3.0", optional = true }
libc = { version = "0.2", optional = true }
mysql = { version = "28.0.0", default-features = false, features = ["minimal"], optional = true }

[lib]
name = "ruzor"
path = "src/lib.rs"

[[bin]]
name = "ruzor"
path = "src/bin/ruzor.rs"

[[bin]]
name = "ruzord"
path = "src/bin/ruzord.rs"

[features]
default = ["backend-gdbm", "backend-redis", "backend-mysql"]
backend-gdbm = ["dep:gdbm-sys", "dep:libc"]
backend-gdbm-native = ["backend-gdbm"]
backend-redis = []
backend-mysql = ["dep:mysql"]

[package.metadata.docs.rs]
no-default-features = true
features = ["backend-redis", "backend-mysql"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
