name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            deps: sudo apt-get update && sudo apt-get install -y libgdbm-dev pkg-config
            test: cargo test --locked
          - name: macOS arm64
            os: macos-15
            deps: brew install gdbm pkg-config
            test: cargo test --locked
          - name: macOS Intel
            os: macos-15-intel
            deps: brew install gdbm pkg-config
            test: >
              cargo test --locked --
              --skip native_gdbm_reads_python_dbm_gnu_records_and_writes_python_record_strings
              --skip pyzord_uses_native_gdbm_backend_file
              --skip pyzord_preserves_existing_python_gdbm_database_file

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: ${{ matrix.deps }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Show versions
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Check default build
        run: cargo check --locked

      - name: Check no-gdbm build
        run: cargo check --locked --no-default-features --features backend-redis,backend-mysql

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Test
        run: ${{ matrix.test }}

      - name: Verify package
        run: cargo package --locked
